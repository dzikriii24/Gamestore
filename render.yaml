services:
  # Laravel Backend API Service
  - type: web
    name: game-store-backend
    runtime: docker
    dockerfilePath: ./Dockerfile.backend
    dockerContext: .
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_URL
        value: https://game-store-backend.onrender.com  # URL hardcode dulu
      - key: LOG_CHANNEL
        value: stderr
      - key: DB_CONNECTION
        value: pgsql
      - key: DATABASE_URL  # Render akan auto inject connection string
        fromDatabase:
          name: gamedb
          property: connectionString
      # Cache & Session
      - key: CACHE_DRIVER
        value: file
      - key: SESSION_DRIVER
        value: file
      - key: QUEUE_CONNECTION
        value: sync
      # Laravel Sanctum
      - key: SANCTUM_STATEFUL_DOMAINS
        value: ".onrender.com"
      - key: SESSION_DOMAIN
        value: ".onrender.com"
    healthCheckPath: /api/games
    autoDeploy: true
    scaling:
      minInstances: 1
      maxInstances: 2
      targetCPUPercent: 70
      targetMemoryPercent: 70

databases:
  - name: gamedb
    databaseName: game_store
    plan: free
    region: singapore