services:
  # Laravel Backend API Service
  - type: web
    name: game-store-backend
    runtime: docker
    dockerfilePath: ./Dockerfile.backend
    dockerContext: .
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: false
      - key: APP_URL
        fromService:
          name: game-store-backend
          type: web
          property: url
      - key: LOG_CHANNEL
        value: stderr
      - key: DB_CONNECTION
        value: pgsql
      - fromDatabase:
          name: gamedb
          property: connectionString
      # Cache & Session
      - key: CACHE_DRIVER
        value: file
      - key: SESSION_DRIVER
        value: file
      - key: QUEUE_CONNECTION
        value: sync
      # Laravel Sanctum
      - key: SANCTUM_STATEFUL_DOMAINS
        generateValue: true
      - key: SESSION_DOMAIN
        generateValue: true
    healthCheckPath: /api/games
    autoDeploy: true
    scaling:
      minInstances: 1
      maxInstances: 1

  # React Frontend Static Site
  - type: static_site
    name: game-store-frontend
    buildCommand: |
      cd frontend
      npm ci
      npm run build
    publishPath: ./frontend/dist
    envVars:
      - key: VITE_API_URL
        fromService:
          name: game-store-backend
          type: web
          property: url
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: Cache-Control
        value: public, max-age=3600
    autoDeploy: true

databases:
  - name: gamedb
    databaseName: game_store
    plan: free
    region: singapore  # Pilih region terdekat